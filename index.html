function saveDB() {
  localStorage.setItem("promanage_db", JSON.stringify(DB));
  applyBranding();
}

function showToast(msg) {
  const t = document.getElementById("toast");
  document.getElementById("toastMsg").innerText = msg;
  t.classList.remove("translate-y-20", "opacity-0");
  setTimeout(() => t.classList.add("translate-y-20", "opacity-0"), 3000);
}

function formatRupiah(num) {
  return (DB.settings.currency || "Rp") + " " + Number(num || 0).toLocaleString("id-ID");
}

function generateId(prefix) {
  return prefix + "-" + Math.floor(1000 + Math.random() * 9000);
}

function compressImage(file, maxWidth = 800, quality = 0.7) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        const canvas = document.createElement("canvas");
        let width = img.width;
        let height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
    };
  });
}

async function syncWithCloud() {
  const url = DB.settings.gasUrl;
  if (!url) {
    showToast("URL Google Apps Script belum diatur di Pengaturan Sistem!");
    return;
  }
  showToast("Menyinkronkan data dengan Cloud...");
  try {
    const settingsArray = Object.entries(DB.settings).map(([key, value]) => ({ key, value }));
    const payload = {
      action: "syncAll",
      data: { ...DB, settings: settingsArray }
    };
    const res = await fetch(url, { method: "POST", body: JSON.stringify(payload) });
    const json = await res.json();
    if (json.status === "success") {
      showToast("Sinkronisasi Cloud Berhasil!");
      document.getElementById("cloudStatusBadge").innerText = "Cloud Terhubung";
      document.getElementById("cloudStatusBadge").className = "text-xs px-3 py-1.5 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-300 font-medium";
    } else {
      showToast("Gagal sinkron: " + json.message);
    }
  } catch (err) {
    showToast("Error koneksi ke Apps Script.");
  }
}

async function pullFromCloud() {
  const url = DB.settings.gasUrl;
  if (!url) return showToast("Isi URL Web App Apps Script terlebih dahulu.");
  showToast("Mengambil data dari Google Sheets...");
  try {
    const res = await fetch(url + "?action=getAll");
    const json = await res.json();
    if (json.status === "success" && json.data) {
      const d = json.data;
      if (d.projects?.length) DB.projects = d.projects;
      if (d.rab?.length) DB.rab = d.rab;
      if (d.tasks?.length) DB.tasks = d.tasks;
      if (d.workers?.length) DB.workers = d.workers;
      if (d.attendance?.length) DB.attendance = d.attendance;
      if (d.cashflow?.length) DB.cashflow = d.cashflow;
      if (d.users?.length) DB.users = d.users;
      if (d.settings?.length) {
        d.settings.forEach(s => { if (s.key !== "gasUrl") DB.settings[s.key] = s.value; });
      }
      saveDB();
      navigate(currentMenu);
      showToast("Data berhasil dimuat dari Cloud!");
    }
  } catch (e) {
    showToast("Gagal mengambil data dari Cloud.");
  }
}

document.getElementById("loginForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const u = document.getElementById("loginUsername").value.trim();
  const p = document.getElementById("loginPassword").value.trim();
  const found = DB.users.find(x => x.username === u && x.password === p && x.status === "Aktif");
  if (found) {
    currentUser = found;
    sessionStorage.setItem("promanage_user", JSON.stringify(found));
    initApp();
  } else {
    alert("Username atau password salah / akun nonaktif!");
  }
});

  sessionStorage.removeItem("promanage_user");
  currentUser = null;
  document.getElementById("mainApp").classList.add("hidden");

}

function toggleDarkMode() {
  document.documentElement.classList.toggle("dark");

}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("-translate-x-full");
  document.getElementById("sidebarOverlay").classList.toggle("hidden");
}

function applyBranding() {
  document.querySelectorAll(".headerAppName").forEach(el => el.innerText = DB.settings.appName);
  document.getElementById("loginAppName").innerText = DB.settings.appName;
  document.getElementById("sidebarCompanyName").innerText = DB.settings.companyName;
  if (DB.settings.gasUrl) {
    document.getElementById("cloudStatusBadge").innerText = "Cloud Siap";

  }
}

function initApp() {
  if (localStorage.getItem("promanage_theme") === "dark") {
    document.documentElement.classList.add("dark");
  }
  applyBranding();
  if (!currentUser) return;

  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("mainApp").classList.remove("hidden");
  document.getElementById("currentUserName").innerText = currentUser.nama;
  document.getElementById("currentUserRole").innerText = currentUser.role;
  document.getElementById("userAvatar").innerText = currentUser.nama.charAt(0).toUpperCase();

  document.querySelectorAll(".nav-item").forEach(btn => {
    const menuKey = btn.getAttribute("data-menu");
    if (menuKey === "dashboard" || currentUser.hakAkses.includes(menuKey)) {
      btn.classList.remove("hidden");
    } else {
      btn.classList.add("hidden");
    }
  });

  navigate("dashboard");
  lucide.createIcons();
}

      btn.classList.remove("text-slate-600", "dark:text-slate-300", "hover:bg-slate-100", "dark:hover:bg-slate-800");
    } else {
      btn.classList.remove("bg-blue-600", "text-white", "shadow-md", "shadow-blue-600/20");
      btn.classList.add("text-slate-600", "dark:text-slate-300", "hover:bg-slate-100", "dark:hover:bg-slate-800");

  });

    document.getElementById("sidebarOverlay").classList.add("hidden");
  }

    dashboard: ["Dashboard Utama", "Ringkasan proyek, RAB, absensi, dan arus kas"],
    proyek: ["Pengaturan Proyek", "Kelola daftar proyek beserta dokumentasi foto Before & After"],
    rab: ["Rencana Anggaran Belanja (RAB)", "Penyusunan RAB per jenis proyek & tanda tangan digital manajer"],
    pekerjaan: ["Pekerjaan Proyek", "Monitoring progres item pekerjaan & jadwal lapangan"],
    pekerja: ["Pekerja & Absensi Proyek", "Database tenaga kerja, upah harian, dan rekap kehadiran"],
    kas: ["Arus Kas Proyek", "Pencatatan pemasukan termin & pengeluaran operasional proyek"],
    laporan: ["Laporan Proyek & Cetak", "Cetak laporan format A4 PDF atau Struk Printer Thermal (58mm/80mm)"],
    users: ["Administrator User & Hak Akses", "Manajemen akun pengguna dan otorisasi modul"],
    settings: ["Pengaturan Sistem & Perusahaan", "Identitas perusahaan, nama aplikasi, dan koneksi Google Apps Script"],
    backup: ["Backup & Restore Data", "Ekspor cadangan database JSON atau pulihkan data"]
  };

  document.getElementById("pageTitle").innerText = titles[menu][0];
  document.getElementById("pageSubtitle").innerText = titles[menu][1];

  switch (menu) {
    case "dashboard": renderDashboard(area); break;
    case "proyek": renderProyek(area); break;
    case "rab": renderRAB(area); break;
    case "pekerjaan": renderPekerjaan(area); break;
    case "pekerja": renderPekerja(area); break;
    case "kas": renderKas(area); break;
    case "laporan": renderLaporan(area); break;
    case "users": renderUsers(area); break;
    case "settings": renderSettings(area); break;
    case "backup": renderBackup(area); break;
  }
  lucide.createIcons();
}

function renderDashboard(area) {
  const totalProyek = DB.projects.length;
  const totalRAB = DB.rab.reduce((acc, r) => acc + Number(r.total || 0), 0);
  const kasMasuk = DB.cashflow.filter(c => c.jenis === "Masuk").reduce((a, b) => a + Number(b.nominal), 0);
  const kasKeluar = DB.cashflow.filter(c => c.jenis === "Keluar").reduce((a, b) => a + Number(b.nominal), 0);
  const saldoKas = kasMasuk - kasKeluar;

  area.innerHTML = `
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-8">
      <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">

          <span class="text-sm text-slate-500">Total Proyek</span>
          <div class="p-2.5 bg-blue-100 dark:bg-blue-900/40 text-blue-600 rounded-xl"><i data-lucide="folder-kanban" class="w-5 h-5"></i></div>
        </div>
        <div class="text-2xl font-bold">${totalProyek} Proyek</div>
        <div class="text-xs text-emerald-500 mt-1">${DB.projects.filter(p => p.status === 'Berjalan').length} Sedang Berjalan</div>
      </div>
      <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <span class="text-sm text-slate-500">Total Nilai RAB</span>
          <div class="p-2.5 bg-indigo-100 dark:bg-indigo-900/40 text-indigo-600 rounded-xl"><i data-lucide="calculator" class="w-5 h-5"></i></div>
        </div>
        <div class="text-2xl font-bold">${formatRupiah(totalRAB)}</div>
        <div class="text-xs text-slate-400 mt-1">${DB.rab.length} Item Anggaran</div>
      </div>
      <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <span class="text-sm text-slate-500">Saldo Kas Proyek</span>
          <div class="p-2.5 bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 rounded-xl"><i data-lucide="wallet" class="w-5 h-5"></i></div>
        </div>
        <div class="text-2xl font-bold ${saldoKas < 0 ? 'text-rose-500' : 'text-emerald-600 dark:text-emerald-400'}">${formatRupiah(saldoKas)}</div>
        <div class="text-xs text-slate-400 mt-1">Masuk: ${formatRupiah(kasMasuk)}</div>
      </div>
      <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <span class="text-sm text-slate-500">Tenaga Kerja Aktif</span>
          <div class="p-2.5 bg-amber-100 dark:bg-amber-900/40 text-amber-600 rounded-xl"><i data-lucide="hard-hat" class="w-5 h-5"></i></div>
        </div>
        <div class="text-2xl font-bold">${DB.workers.length} Orang</div>
        <div class="text-xs text-slate-400 mt-1">${DB.tasks.length} Paket Pekerjaan</div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800">
        <h3 class="font-bold text-base mb-4">Progres Pekerjaan Terkini</h3>
        <div class="space-y-4">
          ${DB.tasks.map(t => {
            const prj = DB.projects.find(p => p.id === t.projectId)?.nama || "-";
            return `
              <div>
                <div class="flex justify-between text-sm mb-1">
                  <span class="font-medium">${t.judul} <span class="text-xs text-slate-400">(${prj})</span></span>
                  <span class="font-bold text-blue-600">${t.progress}%</span>
                </div>
                <div class="w-full bg-slate-200 dark:bg-slate-800 rounded-full h-2.5">
                  <div class="bg-blue-600 h-2.5 rounded-full" style="width: ${t.progress}%"></div>
                </div>
              </div>
            `;
          }).join("") || '<p class="text-sm text-slate-400">Belum ada data pekerjaan.</p>'}
        </div>
      </div>

      <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800">
        <h3 class="font-bold text-base mb-4">Transaksi Arus Kas Terakhir</h3>
        <div class="space-y-3">
          ${DB.cashflow.slice(-5).reverse().map(c => `

              <span class="text-sm font-bold ${c.jenis === 'Masuk' ? 'text-emerald-600' : 'text-rose-500'}">
                ${c.jenis === 'Masuk' ? '+' : '-'} ${formatRupiah(c.nominal)}
              </span>
            </div>
          `).join("")}
        </div>
      </div>
    </div>
  `;
}
