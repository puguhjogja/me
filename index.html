 <!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manajemen Proyek Lapangan</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #f0f2f5; color: #1c1e21; }
  header { background: linear-gradient(135deg, #1e40af, #3b82f6); color: white; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
  header h1 { font-size: 20px; }
  header p { font-size: 12px; opacity: .9; margin-top: 4px; }
  .container { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab { padding: 10px 16px; background: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; color: #555; }
  .tab.active { background: #1e40af; color: white; }
  .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card h2 { font-size: 16px; margin-bottom: 12px; color: #1e40af; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-grid.full { grid-template-columns: 1fr; }
  input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; }
  textarea { resize: vertical; min-height: 60px; }
  label { font-size: 12px; font-weight: 600; color: #666; display: block; margin-bottom: 4px; }
  .btn { padding: 10px 18px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; }
  .btn-primary { background: #1e40af; color: white; }
  .btn-danger { background: #dc2626; color: white; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-outline { background: white; border: 1px solid #ddd; color: #333; }
  .item { border: 1px solid #eee; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .item-head { display: flex; justify-content: space-between; align-items: start; gap: 8px; margin-bottom: 8px; }
  .item-title { font-weight: 700; font-size: 15px; }
  .item-sub { font-size: 12px; color: #666; margin-top: 2px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .badge.planning { background: #fef3c7; color: #92400e; }
  .badge.berjalan { background: #dbeafe; color: #1e40af; }
  .badge.selesai { background: #d1fae5; color: #065f46; }
  .badge.todo { background: #fee2e2; color: #991b1b; }
  .badge.progress { background: #fef3c7; color: #92400e; }
  .badge.done { background: #d1fae5; color: #065f46; }
  .progress-bar { height: 8px; background: #e5e7eb; border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #1e40af); transition: width .3s; }
  .actions { display: flex; gap: 6px; margin-top: 10px; }
  .empty { text-align: center; color: #999; padding: 30px; font-size: 14px; }
  .loading { text-align: center; padding: 20px; color: #666; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: #1c1e21; color: white; padding: 12px 20px; border-radius: 8px; font-size: 14px; opacity: 0; transform: translateY(20px); transition: all .3s; z-index: 1000; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { background: #dc2626; }
  @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>🏗️ Manajemen Proyek Lapangan</h1>
  <p>Data tersimpan otomatis di Google Spreadsheet</p>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('projects')">📁 Proyek</button>
    <button class="tab" onclick="switchTab('tasks')">✅ Tugas</button>
  </div>

  <!-- ================= PROYEK ================= -->
  <div id="tab-projects">
    <div class="card">
      <h2 id="projFormTitle">➕ Tambah Proyek</h2>
      <div class="form-grid">
        <div><label>Nama Proyek</label><input id="p_nama" placeholder="Contoh: Renovasi Gedung A"></div>
        <div><label>Lokasi</label><input id="p_lokasi" placeholder="Contoh: Jakarta Selatan"></div>
        <div><label>Tanggal Mulai</label><input id="p_mulai" type="date"></div>
        <div><label>Tanggal Selesai</label><input id="p_selesai" type="date"></div>
        <div><label>Status</label>
          <select id="p_status">
            <option value="planning">Planning</option>
            <option value="berjalan">Berjalan</option>
            <option value="selesai">Selesai</option>
          </select>
        </div>
        <div><label>PIC</label><input id="p_pic" placeholder="Nama penanggung jawab"></div>
        <div><label>Progres (%)</label><input id="p_progres" type="number" min="0" max="100" value="0"></div>
      </div>
      <div class="actions" style="margin-top:12px">
        <button class="btn btn-primary" onclick="saveProject()">💾 Simpan</button>
        <button class="btn btn-outline" onclick="resetProjectForm()" id="p_cancel" style="display:none">Batal</button>
      </div>
      <input type="hidden" id="p_id">
    </div>

    <div class="card">
      <h2>📋 Daftar Proyek</h2>
      <div id="projList" class="loading">Memuat data...</div>
    </div>
  </div>

  <!-- ================= TUGAS ================= -->
  <div id="tab-tasks" style="display:none">
    <div class="card">
      <h2 id="taskFormTitle">➕ Tambah Tugas</h2>
      <div class="form-grid">
        <div><label>Proyek</label><select id="t_projectId"></select></div>
        <div><label>Judul Tugas</label><input id="t_judul" placeholder="Contoh: Cor lantai 2"></div>
        <div><label>Assignee</label><input id="t_assignee" placeholder="Nama pelaksana"></div>
        <div><label>Deadline</label><input id="t_deadline" type="date"></div>
        <div><label>Status</label>
          <select id="t_status">
            <option value="todo">To Do</option>
            <option value="progress">Progress</option>
            <option value="done">Done</option>
          </select>
        </div>
        <div><label>Catatan</label><input id="t_catatan" placeholder="Opsional"></div>
      </div>
      <div class="actions" style="margin-top:12px">
        <button class="btn btn-primary" onclick="saveTask()">💾 Simpan</button>
        <button class="btn btn-outline" onclick="resetTaskForm()" id="t_cancel" style="display:none">Batal</button>
      </div>
      <input type="hidden" id="t_id">
    </div>

    <div class="card">
      <h2>✅ Daftar Tugas</h2>
      <div id="taskList" class="loading">Memuat data...</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ KONFIGURASI ============
const API_URL = 'https://script.google.com/macros/s/AKfycbwrR-LPjQ8K9N3AxJReQwFMyvIzJ6IErNajBxg-zgA3g1A3hwGm-RtBcuFwGyjXbh5nPQ/exec';
// contoh: https://script.google.com/macros/s/AKfy.../exec

// ============ STATE ============
let state = { projects: [], tasks: [] };

// ============ API ============
async function api(action, data) {
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({ action, ...data }),
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
  });
  const json = await res.json();
  if (!json.success) throw new Error(json.error);
  return json.data;
}

async function loadAll() {
  try {
    const data = await api('getAll', {});
    state.projects = data.projects;
    state.tasks = data.tasks;
    renderProjects();
    renderTasks();
    renderProjectOptions();
  } catch (e) {
    toast('Gagal memuat: ' + e.message, true);
  }
}

// ============ TOAST ============
let toastTimer;
function toast(msg, isErr) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isErr ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = 'toast', 3000);
}

// ============ TABS ============
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-projects').style.display = name === 'projects' ? 'block' : 'none';
  document.getElementById('tab-tasks').style.display = name === 'tasks' ? 'block' : 'none';
}

// ============ PROJECTS ============
function renderProjects() {
  const el = document.getElementById('projList');
  if (state.projects.length === 0) {
    el.innerHTML = '<div class="empty">Belum ada proyek. Tambahkan proyek pertama Anda.</div>';
    return;
  }
  el.innerHTML = state.projects.map(p => `
    <div class="item">
      <div class="item-head">
        <div>
          <div class="item-title">${esc(p.namaProyek)}</div>
          <div class="item-sub">📍 ${esc(p.lokasi || '-')} · PIC: ${esc(p.pic || '-')}</div>
          <div class="item-sub">📅 ${p.mulai || '-'} → ${p.selesai || '-'}</div>
        </div>
        <span class="badge ${p.status}">${p.status}</span>
      </div>
      <div style="font-size:12px;color:#666">Progres: ${p.progres || 0}%</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${p.progres || 0}%"></div></div>
      <div class="actions">
        <button class="btn btn-sm btn-outline" onclick="editProject('${p.id}')">✏️ Edit</button>
        <button class="btn btn-sm btn-danger" onclick="hapusProject('${p.id}','${esc(p.namaProyek)}')">🗑️ Hapus</button>
      </div>
    </div>
  `).join('');
}

function editProject(id) {
  const p = state.projects.find(x => x.id === id);
  if (!p) return;
  document.getElementById('p_id').value = p.id;
  document.getElementById('p_nama').value = p.namaProyek;
  document.getElementById('p_lokasi').value = p.lokasi;
  document.getElementById('p_mulai').value = p.mulai;
  document.getElementById('p_selesai').value = p.selesai;
  document.getElementById('p_status').value = p.status;
  document.getElementById('p_pic').value = p.pic;
  document.getElementById('p_progres').value = p.progres;
  document.getElementById('projFormTitle').textContent = '✏️ Edit Proyek';
  document.getElementById('p_cancel').style.display = 'inline-block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function saveProject() {
  const data = {
    namaProyek: document.getElementById('p_nama').value.trim(),
    lokasi: document.getElementById('p_lokasi').value.trim(),
    mulai: document.getElementById('p_mulai').value,
    selesai: document.getElementById('p_selesai').value,
    status: document.getElementById('p_status').value,
    pic: document.getElementById('p_pic').value.trim(),
    progres: Number(document.getElementById('p_progres').value) || 0
  };
  if (!data.namaProyek) return toast('Nama proyek wajib diisi', true);

  const id = document.getElementById('p_id').value;
  try {
    if (id) {
      data.id = id;
      await api('updateProject', { data });
      toast('Proyek diperbarui');
    } else {
      await api('addProject', { data });
      toast('Proyek ditambahkan');
    }
    resetProjectForm();
    await loadAll();
  } catch (e) { toast(e.message, true); }
}

async function hapusProject(id, nama) {
  if (!confirm(`Hapus proyek "${nama}"? Tugas terkait juga akan terhapus.`)) return;
  try {
    await api('deleteProject', { id });
    toast('Proyek dihapus');
    await loadAll();
  } catch (e) { toast(e.message, true); }
}

function resetProjectForm() {
  ['p_id','p_nama','p_lokasi','p_mulai','p_selesai','p_pic'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('p_status').value = 'planning';
  document.getElementById('p_progres').value = 0;
  document.getElementById('projFormTitle').textContent = '➕ Tambah Proyek';
  document.getElementById('p_cancel').style.display = 'none';
}

// ============ TASKS ============
function renderProjectOptions() {
  const sel = document.getElementById('t_projectId');
  sel.innerHTML = '<option value="">-- Pilih Proyek --</option>' +
    state.projects.map(p => `<option value="${p.id}">${esc(p.namaProyek)}</option>`).join('');
}

function renderTasks() {
  const el = document.getElementById('taskList');
  if (state.tasks.length === 0) {
    el.innerHTML = '<div class="empty">Belum ada tugas.</div>';
    return;
  }
  el.innerHTML = state.tasks.map(t => {
    const proj = state.projects.find(p => p.id === t.projectId);
    return `
      <div class="item">
        <div class="item-head">
          <div>
            <div class="item-title">${esc(t.judul)}</div>
            <div class="item-sub">📁 ${esc(proj ? proj.namaProyek : '(proyek dihapus)')}</div>
            <div class="item-sub">👤 ${esc(t.assignee || '-')} · 📅 ${t.deadline || '-'}</div>
            ${t.catatan ? `<div class="item-sub">📝 ${esc(t.catatan)}</div>` : ''}
          </div>
          <span class="badge ${t.status}">${t.status}</span>
        </div>
        <div class="actions">
          <button class="btn btn-sm btn-outline" onclick="editTask('${t.id}')">✏️ Edit</button>
          <button class="btn btn-sm btn-danger" onclick="hapusTask('${t.id}','${esc(t.judul)}')">🗑️ Hapus</button>
        </div>
      </div>
    `;
  }).join('');
}

function editTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  document.getElementById('t_id').value = t.id;
  document.getElementById('t_projectId').value = t.projectId;
  document.getElementById('t_judul').value = t.judul;
  document.getElementById('t_assignee').value = t.assignee;
  document.getElementById('t_deadline').value = t.deadline;
  document.getElementById('t_status').value = t.status;
  document.getElementById('t_catatan').value = t.catatan;
  document.getElementById('taskFormTitle').textContent = '✏️ Edit Tugas';
  document.getElementById('t_cancel').style.display = 'inline-block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function saveTask() {
  const data = {
    projectId: document.getElementById('t_projectId').value,
    judul: document.getElementById('t_judul').value.trim(),
    assignee: document.getElementById('t_assignee').value.trim(),
    deadline: document.getElementById('t_deadline').value,
    status: document.getElementById('t_status').value,
    catatan: document.getElementById('t_catatan').value.trim()
  };
  if (!data.projectId) return toast('Pilih proyek dulu', true);
  if (!data.judul) return toast('Judul tugas wajib diisi', true);

  const id = document.getElementById('t_id').value;
  try {
    if (id) {
      data.id = id;
      await api('updateTask', { data });
      toast('Tugas diperbarui');
    } else {
      await api('addTask', { data });
      toast('Tugas ditambahkan');
    }
    resetTaskForm();
    await loadAll();
  } catch (e) { toast(e.message, true); }
}

async function hapusTask(id, judul) {
  if (!confirm(`Hapus tugas "${judul}"?`)) return;
  try {
    await api('deleteTask', { id });
    toast('Tugas dihapus');
    await loadAll();
  } catch (e) { toast(e.message, true); }
}

function resetTaskForm() {
  ['t_id','t_judul','t_assignee','t_deadline','t_catatan'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('t_projectId').value = '';
  document.getElementById('t_status').value = 'todo';
  document.getElementById('taskFormTitle').textContent = '➕ Tambah Tugas';
  document.getElementById('t_cancel').style.display = 'none';
}

// ============ UTIL ============
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ============ INIT ============
loadAll();
</script>
</body>
</html>
