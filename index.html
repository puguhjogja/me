// Kompresi Gambar Otomatis dari Kamera HP/Perangkat
function compressImage(file, maxWidth = 800, quality = 0.7) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        const canvas = document.createElement("canvas");
        let width = img.width;
        let height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
    };
  });
}

// Sinkronisasi Cloud Google Apps Script
async function syncWithCloud() {
  const url = DB.settings.gasUrl;
  if (!url) {
    showToast("URL Google Apps Script belum diatur di Menu 8!");
    return;
  }
  showToast("Menyinkronkan data dengan Cloud...");
  try {
    const settingsArray = Object.entries(DB.settings).map(([key, value]) => ({ key, value }));
    const payload = {
      action: "syncAll",
      data: { ...DB, settings: settingsArray }
    };
    const res = await fetch(url, {
      method: "POST",
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if (json.status === "success") {
      showToast("Sinkronisasi Cloud Berhasil!");
      document.getElementById("cloudStatusBadge").innerText = "Cloud Terhubung";
      document.getElementById("cloudStatusBadge").className = "text-xs px-3 py-1.5 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-300 font-medium";
    } else {
      showToast("Gagal sinkron: " + json.message);
    }
  } catch (err) {
    showToast("Error koneksi ke Apps Script.");
  }
}

async function pullFromCloud() {
  const url = DB.settings.gasUrl;
  if (!url) return showToast("Isi URL Web App Apps Script terlebih dahulu.");
  showToast("Mengambil data dari Google Sheets...");
  try {
    const res = await fetch(url + "?action=getAll");
    const json = await res.json();
    if (json.status === "success" && json.data) {
      const d = json.data;
      if (d.projects?.length) DB.projects = d.projects;
      if (d.rab?.length) DB.rab = d.rab;
      if (d.tasks?.length) DB.tasks = d.tasks;
      if (d.workers?.length) DB.workers = d.workers;
      if (d.attendance?.length) DB.attendance = d.attendance;
      if (d.cashflow?.length) DB.cashflow = d.cashflow;
      if (d.users?.length) DB.users = d.users;
      if (d.settings?.length) {
        d.settings.forEach(s => { if (s.key !== "gasUrl") DB.settings[s.key] = s.value; });
      }
      saveDB();
      navigate(currentMenu);
      showToast("Data berhasil dimuat dari Cloud!");
    }
  } catch (e) {
    showToast("Gagal mengambil data dari Cloud.");
  }
}

document.getElementById("loginForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const u = document.getElementById("loginUsername").value.trim();
  const p = document.getElementById("loginPassword").value.trim();
  const found = DB.users.find(x => x.username === u && x.password === p && x.status === "Aktif");

    currentUser = found;
    sessionStorage.setItem("promanage_user", JSON.stringify(found));
    initApp();
  } else {
    alert("Username atau password salah / akun nonaktif!");
  }
});

function initApp() {

  if (!currentUser) return;

  document.getElementById("mainApp").classList.remove("hidden");

  document.getElementById("currentUserRole").innerText = currentUser.role;
  document.getElementById("userAvatar").innerText = currentUser.nama.charAt(0).toUpperCase();

    const menuKey = btn.getAttribute("data-menu");
    if (menuKey === "dashboard" || currentUser.hakAkses.includes(menuKey)) {
      btn.classList.remove("hidden");
    } else {
      btn.classList.add("hidden");
    }
  });

  navigate("dashboard");
  lucide.createIcons();
}

async function handleProjectPhoto(input, type) {
  if (!input.files || !input.files[0]) return;
  showToast("Memproses & mengompresi foto...");
  const base64 = await compressImage(input.files[0]);
  if (type === "before") {
    tempBeforeImg = base64;
    const img = document.getElementById("previewBefore");
    img.src = base64;
    img.classList.remove("hidden");
  } else {
    tempAfterImg = base64;
    const img = document.getElementById("previewAfter");
    img.src = base64;
    img.classList.remove("hidden");
  }
  showToast("Foto siap disimpan!");
}

function editProyek(id) {
  const p = DB.projects.find(x => x.id === id);
  if (!p) return;
  document.getElementById("prjId").value = p.id;
  document.getElementById("prjNama").value = p.nama;
  document.getElementById("prjJenis").value = p.jenis;
  document.getElementById("prjKlien").value = p.klien;
  document.getElementById("prjLokasi").value = p.lokasi;
  document.getElementById("prjMulai").value = p.tanggalMulai;
  document.getElementById("prjStatus").value = p.status;
  if (p.fotoBefore) {
    const img = document.getElementById("previewBefore");
    img.src = p.fotoBefore; img.classList.remove("hidden");
  }
  if (p.fotoAfter) {
    const img = document.getElementById("previewAfter");
    img.src = p.fotoAfter; img.classList.remove("hidden");
  }
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function deleteProyek(id) {
  if (!confirm("Hapus proyek ini?")) return;
  DB.projects = DB.projects.filter(x => x.id !== id);
  saveDB();
  renderProyek(document.getElementById("contentArea"));
  lucide.createIcons();
}

function initSignaturePad() {
  signaturePadCanvas = document.getElementById("sigCanvas");
  if (!signaturePadCanvas) return;
  signaturePadCtx = signaturePadCanvas.getContext("2d");
  signaturePadCtx.strokeStyle = "#0f172a";
  signaturePadCtx.lineWidth = 2.5;
  signaturePadCtx.lineCap = "round";

  const getPos = (e) => {
    const rect = signaturePadCanvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * (signaturePadCanvas.width / rect.width),
      y: (clientY - rect.top) * (signaturePadCanvas.height / rect.height)
    };
  };

  const start = (e) => { isDrawing = true; const p = getPos(e); signaturePadCtx.beginPath(); signaturePadCtx.moveTo(p.x, p.y); };
  const move = (e) => { if (!isDrawing) return; e.preventDefault(); const p = getPos(e); signaturePadCtx.lineTo(p.x, p.y); signaturePadCtx.stroke(); };
  const end = () => { isDrawing = false; };

  signaturePadCanvas.addEventListener("mousedown", start);
  signaturePadCanvas.addEventListener("mousemove", move);
  signaturePadCanvas.addEventListener("mouseup", end);
  signaturePadCanvas.addEventListener("touchstart", start);
  signaturePadCanvas.addEventListener("touchmove", move);
  signaturePadCanvas.addEventListener("touchend", end);
}

function clearSignature() {
  if (signaturePadCtx) signaturePadCtx.clearRect(0, 0, signaturePadCanvas.width, signaturePadCanvas.height);
}

function saveSignatureToRAB() {
  const prjId = document.getElementById("rabProjectId").value;
  const sig = signaturePadCanvas.toDataURL();
  const mgr = document.getElementById("rabManagerName").value;
  DB.rab.forEach(r => {
    if (r.projectId === prjId) {
      r.signatureData = sig;
      r.managerName = mgr;
    }
  });
  saveDB();
  showToast("Tanda tangan Manager Proyek berhasil disematkan pada RAB!");
}

function triggerPrint(htmlContent, mode) {
  const printArea = document.getElementById("printArea");

  document.body.classList.remove("print-a4", "print-thermal-80", "print-thermal-58");
  document.body.classList.add("print-" + mode);
  setTimeout(() => {
    window.print();
    printArea.classList.add("hidden");
  }, 300);
}

function generateAndPrintReport(mode) {
  const prjId = document.getElementById("lapPrj").value;
  const jenis = document.getElementById("lapJenis").value;
  const prj = DB.projects.find(p => p.id === prjId);
  const kas = DB.cashflow.filter(c => c.projectId === prjId);
  const masuk = kas.filter(c => c.jenis === "Masuk").reduce((a, b) => a + Number(b.nominal), 0);
  const keluar = kas.filter(c => c.jenis === "Keluar").reduce((a, b) => a + Number(b.nominal), 0);
  const rabTotal = DB.rab.filter(r => r.projectId === prjId).reduce((a, b) => a + Number(b.total), 0);

  let html = "";
  if (mode.startsWith("thermal")) {
    html = `
      <div style="text-align:center; border-bottom:1px dashed #000; padding-bottom:5px; margin-bottom:6px;">
        <strong>${DB.settings.companyName}</strong><br>
        <span>LAPORAN PROYEK</span><br>
        <small>${prj.nama}</small>
      </div>
      <div>Status: <strong>${prj.status}</strong></div>
      <div>Total RAB: ${formatRupiah(rabTotal)}</div>
      <div>Kas Masuk: ${formatRupiah(masuk)}</div>
      <div>Kas Keluar: ${formatRupiah(keluar)}</div>
      <div style="border-top:1px dashed #000; margin-top:5px; padding-top:5px;">
        <strong>Saldo Kas: ${formatRupiah(masuk - keluar)}</strong>
      </div>
      <div style="text-align:center; margin-top:10px; font-size:9px;">
        Dicetak: ${new Date().toLocaleString('id-ID')}
      </div>
    `;
  } else {
    html = `
      <div style="padding:20px;">
        <div style="border-bottom:2px solid #000; padding-bottom:10px; margin-bottom:15px;">
          <h2 style="margin:0;">${DB.settings.companyName}</h2>
          <p style="margin:2px 0; font-size:11px;">${DB.settings.companyAddress} | ${DB.settings.companyPhone}</p>
        </div>
        <h3 style="text-align:center;">LAPORAN PROYEK: ${prj.nama.toUpperCase()}</h3>
        <p style="font-size:12px;">Jenis: ${prj.jenis} | Lokasi: ${prj.lokasi || '-'} | Status: <strong>${prj.status}</strong></p>

        ${jenis === 'lengkap' ? `
          <h4>1. Dokumentasi Visual (Before & After)</h4>
          <table border="1" cellspacing="0" cellpadding="8" style="width:100%; border-collapse:collapse; text-align:center; margin-bottom:15px;">
            <tr><th>KONDISI AWAL (BEFORE)</th><th>HASIL AKHIR (AFTER)</th></tr>
            <tr>
              <td width="50%">${prj.fotoBefore ? `<img src="${prj.fotoBefore}" style="max-height:160px; margin:auto;">` : 'Tidak ada foto'}</td>
              <td width="50%">${prj.fotoAfter ? `<img src="${prj.fotoAfter}" style="max-height:160px; margin:auto;">` : 'Tidak ada foto'}</td>
            </tr>
          </table>
        ` : ''}

        <h4>Ringkasan Finansial & Arus Kas</h4>
        <table border="1" cellspacing="0" cellpadding="6" style="width:100%; border-collapse:collapse; font-size:11px; margin-bottom:15px;">
          <tr><td>Total Rencana Anggaran (RAB)</td><td align="right"><strong>${formatRupiah(rabTotal)}</strong></td></tr>
          <tr><td>Total Pemasukan Proyek</td><td align="right">${formatRupiah(masuk)}</td></tr>
          <tr><td>Total Pengeluaran Proyek</td><td align="right">${formatRupiah(keluar)}</td></tr>
          <tr style="background:#f1f5f9;"><td><strong>SALDO KAS BERSIH</strong></td><td align="right"><strong>${formatRupiah(masuk - keluar)}</strong></td></tr>
        </table>

        <h4>Detail Transaksi Kas</h4>
        <table border="1" cellspacing="0" cellpadding="5" style="width:100%; border-collapse:collapse; font-size:11px;">
          <thead><tr><th>Tanggal</th><th>Kategori</th><th>Keterangan</th><th>Jenis</th><th>Nominal</th></tr></thead>
          <tbody>
            ${kas.map(k => `<tr><td>${k.tanggal}</td><td>${k.kategori}</td><td>${k.keterangan}</td><td>${k.jenis}</td><td align="right">${formatRupiah(k.nominal)}</td></tr>`).join("")}
          </tbody>
        </table>
      </div>
    `;
  }
  triggerPrint(html, mode);
}

function renderBackup(area) {
  area.innerHTML = `
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl">
      <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800">
        <div class="p-3 bg-blue-100 dark:bg-blue-900/30 text-blue-600 rounded-xl w-fit mb-4">
          <i data-lucide="download" class="w-6 h-6"></i>
        </div>
        <h3 class="font-bold text-lg mb-2">Backup Database (.JSON)</h3>
        <p class="text-sm text-slate-500 mb-5">Unduh seluruh data proyek, foto before/after, RAB, pekerja, absensi, arus kas, dan pengaturan ke dalam satu file cadangan.</p>
        <button onclick="downloadBackup()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm">Unduh File Backup Sekarang</button>
      </div>

      <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800">
        <div class="p-3 bg-amber-100 dark:bg-amber-900/30 text-amber-600 rounded-xl w-fit mb-4">
          <i data-lucide="upload" class="w-6 h-6"></i>
        </div>
        <h3 class="font-bold text-lg mb-2">Restore Database</h3>
        <p class="text-sm text-slate-500 mb-4">Pilih file backup <code>.json</code> untuk memulihkan seluruh data aplikasi.</p>
        <input type="file" id="restoreFile" accept=".json" class="block w-full text-xs mb-4">
        <button onclick="restoreBackup()" class="w-full py-3 bg-amber-600 hover:bg-amber-700 text-white font-semibold rounded-xl text-sm">Pulihkan Data</button>
      </div>
    </div>
  `;
}

function downloadBackup() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(DB, null, 2));
  const a = document.createElement("a");
  a.href = dataStr;
  a.download = `Backup_ProManage_${new Date().toISOString().split("T")[0]}.json`;
  a.click();
  showToast("File backup berhasil diunduh!");
}

function restoreBackup() {
  const fileInput = document.getElementById("restoreFile");
  if (!fileInput.files.length) return alert("Pilih file backup .json terlebih dahulu!");
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (parsed.projects && parsed.settings) {
        DB = parsed;
        saveDB();
        showToast("Database berhasil dipulihkan!");
        navigate("dashboard");
      } else {
        alert("Format file backup tidak valid!");
      }
    } catch (err) {
      alert("Gagal membaca file backup.");
    }
  };
  reader.readAsText(fileInput.files[0]);
}
